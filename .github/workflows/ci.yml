name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: uv sync --locked
      - name: Backend quality
        working-directory: backend
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src
          uv run pytest -q

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium
      - name: Frontend quality
        working-directory: frontend
        run: |
          npm run contracts:verify
          npm run lint
          npm run typecheck
          npm test
          npm run test:e2e

  windows-product:
    runs-on: windows-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: uv sync --locked
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build installer
        working-directory: frontend
        run: npm run build:package
      - name: Installed product E2E
        working-directory: frontend
        run: npm run test:product
      - name: Record product evidence summary
        if: always()
        working-directory: frontend
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows product evidence"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Commit: $env:GITHUB_SHA"

          $installerPath = "release/XingXie-1.0.0-rc.1-Setup.exe"
          if (Test-Path -LiteralPath $installerPath) {
            $installer = Get-Item -LiteralPath $installerPath
            $installerHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Installer bytes: $($installer.Length)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Installer SHA-256: $installerHash"
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Installer: not produced"
          }

          $reportPath = Get-ChildItem -Path "test-results/product-e2e" -Filter "stage9-product-report.json" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -ne $reportPath) {
            $report = Get-Content -LiteralPath $reportPath.FullName -Raw | ConvertFrom-Json
            $summary = [ordered]@{
              formalAgentRuns = $report.formalAgentRuns
              qualityGateEvaluations = $report.qualityGateEvaluations
              lockedArtifactVersions = $report.lockedArtifactVersions
              handoffs = $report.handoffs
              manualApprovals = $report.manualApprovals
              autonomousHandoffs = $report.autonomousHandoffs
              userVisibleOrchestration = $report.userVisibleOrchestration
            }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```json'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($summary | ConvertTo-Json -Compress)
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Product report: not produced"
          }
      - name: Upload product test evidence
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: windows-product-evidence
          path: frontend/test-results/product-e2e
          if-no-files-found: warn
          retention-days: 7
